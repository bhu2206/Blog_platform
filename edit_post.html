<!DOCTYPE html>

<html>

<head>

    <title>Edit Post</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<div class="container mt-5">


    <div class="row justify-content-center">


        <div class="col-md-8">


            <div class="card shadow">


                <div class="card-body p-4">


                    <h2>

                        ✏️ Edit Blog Post

                    </h2>


                    <form method="POST">


                        <div class="mb-3">

                            <label class="form-label">

                                Title

                            </label>


                            <input
                                type="text"
                                name="title"
                                value="{{ post.title }}"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">

                                Content

                            </label>


                            <textarea
                                name="content"
                                rows="10"
                                class="form-control"
                                required>{{ post.content }}</textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary">

                            Save Changes

                        </button>


                        <a
                            href="/post/{{ post.id }}"
                            class="btn btn-secondary">

                            Cancel

                        </a>


                    </form>


                </div>


            </div>


        </div>


    </div>


</div>


</body>

</html>
